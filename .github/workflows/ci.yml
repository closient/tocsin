name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# GitHub-hosted runners only: this repository is public, and a self-hosted
# runner would execute pull requests from forks.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  # The JSON Schema editors use must match the code and accept every
  # example, both as CI generates it and through each file's own
  # `#:schema` directive, the way an editor reads it.
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The committed schema matches the code
        run: |
          cargo run --locked --quiet -- config schema > "$RUNNER_TEMP/tocsin.schema.json"
          diff -u schema/tocsin.schema.json "$RUNNER_TEMP/tocsin.schema.json"
      - name: Install taplo 0.10.0
        env:
          TAPLO_URL: https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz
          TAPLO_SHA256: 8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/taplo.gz" "$TAPLO_URL"
          echo "$TAPLO_SHA256  $RUNNER_TEMP/taplo.gz" | sha256sum --check --strict
          gunzip "$RUNNER_TEMP/taplo.gz"
          chmod +x "$RUNNER_TEMP/taplo"
      - name: The schema validates examples/config
        run: |
          mapfile -t files < <(find examples/config -name '*.toml' | sort)
          test "${#files[@]}" -gt 0
          missing=0
          for file in "${files[@]}"; do
            if ! head -n 1 "$file" | grep -q '^#:schema '; then
              echo "::error file=$file::the first line must be a #:schema directive"
              missing=1
            fi
          done
          test "$missing" -eq 0
          "$RUNNER_TEMP/taplo" check --no-auto-config --schema "file://$RUNNER_TEMP/tocsin.schema.json" "${files[@]}"
          "$RUNNER_TEMP/taplo" check --no-auto-config "${files[@]}"

  # CONTRIBUTING.md promises unsigned commits are not merged; this keeps
  # that promise. Every commit the pull request adds needs a Signed-off-by.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -q .; then
              echo "::error::commit $commit has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit "$missing"

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
