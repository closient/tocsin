name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# GitHub-hosted runners only: this repository is public, and a self-hosted
# runner would execute pull requests from forks.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --locked
      # The runners refuse unprivileged ICMP sockets, and the ICMP probe test
      # fails under CI rather than skip, so allow them for every group.
      - name: Allow unprivileged ICMP sockets
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      # The /metrics test pipes a scrape through `promtool check metrics`;
      # under CI it fails rather than skip when TOCSIN_PROMTOOL is unset.
      - name: Install promtool 3.13.5
        env:
          PROMETHEUS_VERSION: 3.13.5
          PROMETHEUS_SHA256_AMD64: 0388822ace519c5a3a8ef556a541ce1b536e21d872f82deded465bd27a5a0699
          PROMETHEUS_SHA256_ARM64: e705357ffa5b3189e98bf145d044364d75dd994470c706a07731292932b2ee0f
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=amd64 sha256=$PROMETHEUS_SHA256_AMD64 ;;
            ARM64) arch=arm64 sha256=$PROMETHEUS_SHA256_ARM64 ;;
            *) echo "no promtool pinned for $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          name="prometheus-$PROMETHEUS_VERSION.linux-$arch"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/$name.tar.gz"
          echo "$sha256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$name.tar.gz" --directory "$RUNNER_TEMP" "$name/promtool"
          "$RUNNER_TEMP/$name/promtool" --version
          echo "TOCSIN_PROMTOOL=$RUNNER_TEMP/$name/promtool" >> "$GITHUB_ENV"
      - name: The example alert rules are valid and pass their tests
        run: |
          "$TOCSIN_PROMTOOL" check rules examples/prometheus/tocsin-rules.yml
          "$TOCSIN_PROMTOOL" test rules examples/prometheus/tocsin-rules.test.yml
      - run: cargo test --workspace --locked

  # The JSON Schema editors use must accept every example, both as
  # committed and through each file's own `#:schema` directive, the way an
  # editor reads it. That the committed schema matches the code is the test
  # `the_committed_schema_is_current`.
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install taplo 0.10.0
        env:
          TAPLO_URL: https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz
          TAPLO_SHA256: 8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/taplo.gz" "$TAPLO_URL"
          echo "$TAPLO_SHA256  $RUNNER_TEMP/taplo.gz" | sha256sum --check --strict
          gunzip "$RUNNER_TEMP/taplo.gz"
          chmod +x "$RUNNER_TEMP/taplo"
      - name: The schema validates examples/config
        run: |
          mapfile -t files < <(find examples/config -name '*.toml' | sort)
          test "${#files[@]}" -gt 0
          missing=0
          for file in "${files[@]}"; do
            if ! head -n 1 "$file" | grep -q '^#:schema '; then
              echo "::error file=$file::the first line must be a #:schema directive"
              missing=1
            fi
          done
          test "$missing" -eq 0
          "$RUNNER_TEMP/taplo" check --no-auto-config --schema "file://$GITHUB_WORKSPACE/schema/tocsin.schema.json" "${files[@]}"
          "$RUNNER_TEMP/taplo" check --no-auto-config "${files[@]}"

  # The p99 append latency of 100 checks, on one core, while retention
  # purges a backlog, must stay under 50 ms. Checkpoints used to run inside
  # writes and put p99s of up to 320 ms here; off the write path, 60 runs
  # across runner types stayed under 12 ms (TOC-57, docs/storage.md).
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --release --locked -p tocsin-store --test write_latency --no-run
      - name: Write latency on one core
        run: taskset -c 0 cargo test --release --locked -p tocsin-store --test write_latency -- --ignored --nocapture

  # The release's Linux packaging, on each architecture. dist builds the
  # static musl archive the release would; the container image is built from
  # that archive and run as its non-root user; and deploy/tocsin.service is
  # verified, scored, and started with the binary. Building the macOS
  # archive, and publishing anything, happen only on a tag (release.yml).
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install dist and the musl toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build the release archive
        run: dist build --artifacts=local --target ${{ matrix.target }} --print=linkage
      - name: Unpack it into the image's build context
        run: scripts/image-context.sh target/distrib target/image
      - name: A configuration with one ICMP check, of the loopback address
        run: |
          mkdir -p "$RUNNER_TEMP/loopback"
          cat > "$RUNNER_TEMP/loopback/tocsin.toml" <<'EOF'
          [server]
          listen = "0.0.0.0:8080"

          [[component]]
          id = "loopback"
          name = "Loopback"

          [[check]]
          id = "loopback"
          component = "loopback"
          type = "icmp"
          target = "127.0.0.1"
          interval = "30s"
          EOF

      - name: Build the image
        run: docker build --platform linux/${{ matrix.arch }} --build-arg VERSION=ci --tag tocsin:ci --file Dockerfile target/image
      - name: The image runs as nonroot and checks the examples
        run: |
          test "$(docker inspect tocsin:ci --format '{{.Config.User}}')" = 65532:65532
          docker run --rm tocsin:ci --version
          cat > "$RUNNER_TEMP/examples.env" <<'EOF'
          TOCSIN_SMTP_URL=smtp://status:placeholder@mail.example.com:587
          TOCSIN_CI_TOKEN=placeholder-ci-token
          TOCSIN_BACKUP_TOKEN=placeholder-backup-token
          TOCSIN_RELEASE_TOKEN=placeholder-release-token
          TOCSIN_SLACK_WEBHOOK_URL=https://hooks.slack.com/services/placeholder
          TOCSIN_PUSHOVER_USER_KEY=placeholder-user
          TOCSIN_PUSHOVER_API_TOKEN=placeholder-token
          TOCSIN_WEBHOOK_SIGNING_SECRET=placeholder-signing-secret
          EOF
          docker run --rm --env-file "$RUNNER_TEMP/examples.env" \
            --volume "$PWD/examples/config:/config:ro" tocsin:ci config check --config /config
      # Docker allows unprivileged ICMP sockets in every container. With
      # them refused, only root's CAP_NET_RAW can send the echo; the
      # nonroot user has no capabilities, and must fail.
      - name: ICMP from the image, both ways
        run: |
          run() { docker run --rm --volume "$RUNNER_TEMP/loopback:/config:ro" "$@" probe run loopback --config /config; }
          run tocsin:ci
          run --sysctl net.ipv4.ping_group_range="1 0" --user 0:0 tocsin:ci
          status=0
          run --sysctl net.ipv4.ping_group_range="1 0" tocsin:ci || status=$?
          test "$status" -eq 3
      - name: The image serves from a named volume
        run: |
          docker run --detach --name tocsin --volume "$RUNNER_TEMP/loopback:/config:ro" \
            --volume tocsin-data:/data --publish 127.0.0.1:8080:8080 tocsin:ci
          for _ in $(seq 30); do
            curl --fail --silent --output /dev/null http://127.0.0.1:8080/api/v1/openapi.json && break
            sleep 1
          done
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/api/v1/openapi.json
          docker logs tocsin
          docker rm --force tocsin

      - name: Install the systemd unit
        run: |
          sudo install -m 0755 target/image/${{ matrix.arch }}/tocsin /usr/local/bin/tocsin
          sudo install -D -m 0644 "$RUNNER_TEMP/loopback/tocsin.toml" /etc/tocsin/tocsin.toml
          sudo install -m 0644 deploy/tocsin.service /etc/systemd/system/tocsin.service
          sudo systemctl daemon-reload
      - name: systemd-analyze verify and security
        run: |
          systemd-analyze verify /etc/systemd/system/tocsin.service
          systemd-analyze security --no-pager tocsin.service
          systemd-analyze security --threshold=20 tocsin.service > /dev/null
      # The unit's sandbox, running one ICMP probe in place of the server.
      # Unprivileged ICMP sockets are refused, so the echo needs the unit's
      # CAP_NET_RAW; without it, the same probe must fail.
      - name: ICMP under the unit
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="1 0"
          sudo mkdir -p /etc/systemd/system/tocsin.service.d
          printf '%s\n' '[Service]' 'Type=oneshot' 'Restart=no' 'ExecStart=' \
            'ExecStart=/usr/local/bin/tocsin probe run loopback --config /etc/tocsin' |
            sudo tee /etc/systemd/system/tocsin.service.d/probe.conf
          sudo systemctl daemon-reload
          sudo systemctl start tocsin
          printf '%s\n' '[Service]' 'AmbientCapabilities=' |
            sudo tee /etc/systemd/system/tocsin.service.d/no-capability.conf
          sudo systemctl daemon-reload
          if sudo systemctl start tocsin; then
            echo "::error::the probe passed without CAP_NET_RAW"
            exit 1
          fi
          test "$(systemctl show tocsin --property=ExecMainStatus --value)" -eq 3
          sudo journalctl --unit tocsin --no-pager
          sudo rm -r /etc/systemd/system/tocsin.service.d
          sudo systemctl daemon-reload
      - name: The unit serves
        run: |
          sudo systemctl start tocsin
          for _ in $(seq 30); do
            curl --fail --silent --output /dev/null http://127.0.0.1:8080/api/v1/openapi.json && break
            sleep 1
          done
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/api/v1/openapi.json
          systemctl is-active tocsin
          sudo test -f /var/lib/private/tocsin/tocsin.db
          sudo journalctl --unit tocsin --no-pager

  # CONTRIBUTING.md promises unsigned commits are not merged; this keeps
  # that promise. Every commit the pull request adds needs a Signed-off-by.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -q .; then
              echo "::error::commit $commit has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit "$missing"

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
