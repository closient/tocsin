# Publishes the container image for a release. release.yml (generated by
# dist from dist-workspace.toml) calls this once the GitHub Release exists,
# for every tag that is not a prerelease. The image is assembled from the
# release's own musl archives, so it holds exactly the released binaries;
# nothing is compiled here, and no emulation is needed for arm64.
name: Publish image

on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan for the release, as JSON.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the Linux archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*-unknown-linux-musl
          path: target/distrib/
          merge-multiple: true
      - name: Unpack them into the build context
        run: |
          scripts/image-context.sh target/distrib target/image
          test -x target/image/amd64/tocsin
          test -x target/image/arm64/tocsin
      - name: Sign in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        run: |
          version="${TAG#v}"
          docker buildx create --use --driver docker-container
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$version" \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:${version%.*}" \
            --tag "$IMAGE:latest" \
            --file Dockerfile \
            --push \
            target/image
