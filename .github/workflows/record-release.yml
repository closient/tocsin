# Records each tocsin release in tocsin's own release log: release.yml
# (generated by dist from dist-workspace.toml) calls this after the GitHub
# Release is announced. It runs the released binary, so a release that
# cannot publish itself fails here. The server needs the `tocsin` project
# and a token with the `release` scope (examples/config/releases.toml); set
# the repository variable TOCSIN_URL and the secret TOCSIN_RELEASE_TOKEN.
# Federated hubs keep separate release logs, so TOCSIN_URL may list several
# servers separated by spaces; each gets its own publish, with the same token,
# and the job fails if any of them refused it.
name: Record release

on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan for the release, as JSON.
        required: true
        type: string

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04
    env:
      TOCSIN_URL: ${{ vars.TOCSIN_URL }}
      TOCSIN_TOKEN: ${{ secrets.TOCSIN_RELEASE_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      TITLE: ${{ fromJson(inputs.plan).announcement_title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: The release log is configured
        run: |
          missing=0
          if [ -z "$TOCSIN_URL" ]; then
            echo "::error::set the repository variable TOCSIN_URL to the tocsin server that keeps tocsin's release log"
            missing=1
          fi
          if [ -z "$TOCSIN_TOKEN" ]; then
            echo "::error::set the repository secret TOCSIN_RELEASE_TOKEN to a token with the release scope on that server"
            missing=1
          fi
          exit "$missing"
      - name: Fetch the released binary
        run: |
          name=tocsin-x86_64-unknown-linux-musl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP" \
            --pattern "$name.tar.xz" --pattern "$name.tar.xz.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check --strict "$name.tar.xz.sha256")
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 "$name/tocsin"
      - name: Publish the release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          read -r -a servers <<<"$TOCSIN_URL"
          failed=0
          for server in "${servers[@]}"; do
            if ! TOCSIN_URL="$server" "$RUNNER_TEMP/tocsin" release publish \
              --project tocsin \
              --version "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --release-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"; then
              echo "::error::$server did not record $TAG"
              failed=1
            fi
          done
          exit "$failed"
