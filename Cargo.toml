[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/closient/tocsin"
homepage = "https://github.com/closient/tocsin"
publish = false

[workspace.dependencies]
tocsin-core = { path = "crates/tocsin-core" }
tocsin-store = { path = "crates/tocsin-store" }
tocsin-probe = { path = "crates/tocsin-probe" }
tocsin-engine = { path = "crates/tocsin-engine" }
tocsin-alert = { path = "crates/tocsin-alert" }
ammonia = "4.1"
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
fastrand = "2.3"
futures-util = { version = "0.3", default-features = false }
gethostname = "1.1"
hex = "0.4"
hmac = "0.12"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
http = "1.5"
# `serve` owns its connection tasks, so a shutdown can abort and await
# them; axum already builds on these two.
hyper = { version = "1.12", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
insta = { version = "1.49", features = ["json"] }
# Email over SMTP, with rustls on ring and the platform verifier like reqwest.
# The default features pull in native-tls, and "builder" pulls in
# quoted_printable (0BSD, not on the license allowlist): tocsin writes the
# message itself.
lettre = { version = "0.11", default-features = false, features = ["hostname", "smtp-transport", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
# Watches the configuration folder for `tocsin serve` to reload. 9.0 is
# still a release candidate.
notify = "8.2"
# The OTLP wire format for `[telemetry.otlp]`: only the generated protobuf
# messages. tocsin builds each export from the state `/metrics` reads, so
# it needs none of the SDK's pipeline, and `gen-tonic` (the gRPC client) is
# switched on by the `grpc` feature alone.
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "metrics"] }
percent-encoding = "2.3"
prometheus-client = "0.25"
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17"
# The MCP server: streamable HTTP at /mcp and stdio for `tocsin mcp`.
rmcp = { version = "3.7", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "transport-io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
serde_path_to_error = "0.1"
sha2 = "0.10"
subtle = "2.6"
surge-ping = "0.9"
toml = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# gRPC for `[telemetry.otlp] protocol = "grpc"`, behind tocsin's `grpc` feature.
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-ring", "tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
utoipa = "6.0"
utoipa-axum = "0.3"
x509-parser = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# What `dist` builds release binaries with (dist-workspace.toml).
[profile.dist]
inherits = "release"
