[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/closient/tocsin"
homepage = "https://github.com/closient/tocsin"
publish = false

[workspace.dependencies]
tocsin-core = { path = "crates/tocsin-core" }
tocsin-store = { path = "crates/tocsin-store" }
tocsin-probe = { path = "crates/tocsin-probe" }
clap = { version = "4.5", features = ["derive"] }
gethostname = "1.1"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
surge-ping = "0.9"
toml = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
