[package]
name = "tocsin-alert"
description = "Operator alerting for tocsin: routes, notifiers and the durable delivery worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tocsin-core.workspace = true
tocsin-engine.workspace = true
tocsin-store.workspace = true
base64.workspace = true
hex.workspace = true
hmac.workspace = true
jiff.workspace = true
lettre.workspace = true
prometheus-client.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "net", "io-util"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
# Installs the TLS provider for the tests' HTTP client, as the binary does.
rustls.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "net", "io-util", "test-util"] }

[lints]
workspace = true
