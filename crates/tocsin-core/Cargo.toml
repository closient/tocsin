[package]
name = "tocsin-core"
description = "Domain types, configuration model and assertions for tocsin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# base64 and ring: node keys, which sign and verify federation pushes.
base64.workspace = true
http.workspace = true
# `[page] timezone` is checked against a time zone database compiled in:
# core reads no files, and the container image has no /usr/share/zoneinfo.
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
regex.workspace = true
ring.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_path.workspace = true
toml.workspace = true
utoipa.workspace = true
