[package]
name = "tocsin-store"
description = "SQLite history store for tocsin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tocsin-core.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing.workspace = true

[dev-dependencies]
# The tests race a second connection against a read and count statements.
rusqlite = { version = "0.40", features = ["bundled", "hooks", "trace"] }
tempfile = "3"

[lints]
workspace = true

