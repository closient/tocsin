[package]
name = "tocsin"
description = "Single-binary uptime monitor, status page and release log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tocsin-core.workspace = true
tocsin-engine.workspace = true
tocsin-probe.workspace = true
ammonia.workspace = true
askama.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
gethostname.workspace = true
jiff.workspace = true
pulldown-cmark.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
# `rc` serializes the `Arc<Incident>` an event shares with the response.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
serde_path_to_error.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time"] }
tocsin-store.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Same version as tocsin-store's, to set up databases a newer build wrote.
rusqlite = { version = "0.40", features = ["bundled"] }
insta = { workspace = true }
tempfile = "3"
tocsin-core.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
# Paused time for the key-cache tests.
tokio = { workspace = true, features = ["test-util"] }
