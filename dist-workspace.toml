# Release builds: `dist` (cargo-dist) turns a `v*` tag into a GitHub Release
# with static binaries, checksums, the JSON Schema and the OpenAPI document,
# and publishes the container image. docs/install.md describes the result;
# after changing this file, run `dist generate` and commit the workflow.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
hosting = "github"
installers = []
# Static musl binaries for Linux, and Apple silicon. tocsin builds only for
# Unix-like systems.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "aarch64-apple-darwin"]
checksum = "sha256"
# Pull requests run `dist plan`; building runs on tags.
pr-run-mode = "upload"
# The image is built from the released musl binaries, so it holds exactly
# what the release does (.github/workflows/publish-image.yml).
publish-jobs = ["./publish-image"]
# Records the release in tocsin's own release log (.github/workflows/record-release.yml).
post-announce-jobs = ["./record-release"]

# Native arm64 runners: no cross toolchain, and the same runner the test
# job uses.
[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
aarch64-apple-darwin = "macos-15"

# The config JSON Schema, the OpenAPI document and their checksums
# (scripts/release-documents.sh).
[[dist.extra-artifacts]]
artifacts = ["schema/tocsin.schema.json", "schema/openapi.json", "target/documents.sha256"]
build = ["scripts/release-documents.sh"]

# Actions are pinned to a commit, as in ci.yml.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"swatinem/rust-cache" = "d1527c8f67ef9af357290475d4af4b0fab8f12e0" # v2.9.3
