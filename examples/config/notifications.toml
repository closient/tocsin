#:schema ../../schema/tocsin.schema.json
# Where operator alerts go. Secrets are always `${ENV:NAME}` references and
# never sit in these files; `tocsin config show` prints them redacted.

[[notifier]]
id = "ops-slack"
type = "slack"

[notifier.slack]
webhook_url = "${ENV:TOCSIN_SLACK_WEBHOOK_URL}"

[[notifier]]
id = "ops-email"
type = "email"

[notifier.email]
to = ["ops@example.com"]

[[notifier]]
id = "on-call"
type = "pushover"

[notifier.pushover]
user_key = "${ENV:TOCSIN_PUSHOVER_USER_KEY}"
api_token = "${ENV:TOCSIN_PUSHOVER_API_TOKEN}"
# 2 is an emergency: Pushover repeats it until acknowledged, and the
# resolve cancels it.
down_priority = 2

# Signed JSON for your own tooling; docs/alerting.md shows how to verify it.
[[notifier]]
id = "incident-bot"
type = "webhook"

[notifier.webhook]
url = "https://incidents.example.com/hooks/tocsin"
signing_secret = "${ENV:TOCSIN_WEBHOOK_SIGNING_SECRET}"

# Everything degraded or worse goes to Slack and email.
[[route]]
id = "everything"
notifiers = ["ops-slack", "ops-email", "incident-bot"]
notify_on = "degraded"
# Re-sent every 4 hours while still failing; a resolve follows the recovery.
repeat = "4h"
resolve = true

# Only customer-facing outages page someone.
[[route]]
id = "page-on-call"
notifiers = ["on-call"]
groups = ["customer-facing"]
notify_on = "down"
